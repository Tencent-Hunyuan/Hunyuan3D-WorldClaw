name: Deploy project page

# Requires "Settings > Pages > Build and deployment > Source" to be set to
# "GitHub Actions". No gh-pages branch and no deploy key are involved.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Queue deployments instead of cancelling them: a cancelled run would leave the
# published site on whatever the previous deployment was.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # `npm ci` needs package-lock.json to be committed and in sync.
      - name: Install dependencies
        run: npm ci

      # `npm run build` is `tsc -b && vite build`, so type errors fail the deploy.
      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
